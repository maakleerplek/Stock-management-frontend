name: Laser Timer (Windows)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    paths:
      - 'laser-timer-widget/**'
      - '.github/workflows/laser-timer.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: laser-timer-widget

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: laser-timer-widget/src-tauri

      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: laser-timer-windows
          path: |
            laser-timer-widget/src-tauri/target/release/bundle/nsis/*.exe
            laser-timer-widget/config.example.json

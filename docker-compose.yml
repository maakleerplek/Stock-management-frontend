services:
  frontend:
    build:
      context: .
      args:
        VITE_ORGANIZATION_NAME: ${VITE_ORGANIZATION_NAME}
        VITE_ORGANIZATION_URL: ${VITE_ORGANIZATION_URL}
        VITE_INVENTREE_URL: ${VITE_INVENTREE_URL}
        VITE_INVENTREE_PANEL_URL: ${VITE_INVENTREE_PANEL_URL}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI}
        VITE_LASER_PRICE_PER_MIN: ${VITE_LASER_PRICE_PER_MIN}
        VITE_CNC_PRICE_PER_MIN: ${VITE_CNC_PRICE_PER_MIN}
        VITE_PRINT_PRICE_PER_GRAM: ${VITE_PRINT_PRICE_PER_GRAM}
        VITE_CURRENCY: ${VITE_CURRENCY}
        VITE_PAYMENT_NAME: ${VITE_PAYMENT_NAME}
        VITE_PAYMENT_IBAN: ${VITE_PAYMENT_IBAN}
        VITE_PAYCONIQ_MERCHANT_ID: ${VITE_PAYCONIQ_MERCHANT_ID}
        VITE_DOCS_URL: ${VITE_DOCS_URL}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL}
        VITE_TV_PRESENTATION_URL: ${VITE_TV_PRESENTATION_URL}
    container_name: stock-frontend
    environment:
      # Runtime environment variable for Caddy to proxy to InvenTree backend
      - INVENTREE_BACKEND_URL=${INVENTREE_BACKEND_URL}
      # Secrets stay on the server: nginx adds the token to API calls and checks
      # the volunteer password. The VITE_ names still work for older .env files.
      - INVENTREE_TOKEN=${INVENTREE_TOKEN:-${VITE_INVENTREE_TOKEN}}
      - VOLUNTEER_PASSWORD=${VOLUNTEER_PASSWORD:-${VITE_VOLUNTEER_PASSWORD}}
      # Host IP for SSL certificate generation
      - HOST_IP=${HOST_IP}
    ports:
      - "${FRONTEND_HTTP_PORT:-8082}:80"
      - "${FRONTEND_HTTPS_PORT:-8444}:443"
    volumes:
      - ssl-certs:/etc/nginx/ssl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Laser time tracking (ESP32 on the laser, UDP 5005) and laser settings.
  # nginx proxies /laser/ here; see laser/app.py.
  laser:
    build: ./laser
    container_name: stock-laser
    environment:
      # Reads the material list from InvenTree (category Lasermaterialen).
      - INVENTREE_BACKEND_URL=${INVENTREE_BACKEND_URL}
      - INVENTREE_TOKEN=${INVENTREE_TOKEN:-${VITE_INVENTREE_TOKEN}}
      - COST_PER_MIN=${VITE_LASER_PRICE_PER_MIN:-0.50}
      # 1 = test buttons that switch the laser on/off without the ESP32.
      - LASER_SIMULATE=${LASER_SIMULATE:-0}
    ports:
      - "${LASER_UDP_PORT:-5005}:5005/udp"
    volumes:
      - laser-data:/data
    restart: unless-stopped

volumes:
  ssl-certs:
  laser-data:
